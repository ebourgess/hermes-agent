# Hermes static-message catalog -- Arabic
#
# Only user-facing static messages from the CLI approval prompt and a handful
# of gateway slash-command replies live here.  Agent-generated output, log
# lines, error tracebacks, tool outputs, and slash-command descriptions stay
# in English and are NOT translated -- see agent/i18n.py for scope rationale.
#
# Keys are dotted paths; nesting below is purely for readability.  Values may
# contain {placeholder} tokens for str.format substitution.  When adding a
# new key, add it to EVERY locale file (en/zh/ja/de/es/fr/tr/uk) in the same commit --
# tests/agent/test_i18n.py asserts catalog parity.

approval:
  # CLI approval prompt -- shown when a dangerous command needs user review.
  dangerous_header: "⚠️  أمر خطير: {description}"
  choose_long:     "      [o] مرة واحدة  |  [s] لهذه الجلسة  |  [a] دائمًا  |  [d] رفض"
  choose_short:    "      [o] مرة واحدة  |  [s] لهذه الجلسة  |  [d] رفض"
  prompt_long:     "      الاختيار [o/s/a/D]: "
  prompt_short:    "      الاختيار [o/s/D]: "
  timeout:         "      ⏱ انتهت المهلة - تم رفض الأمر"
  allowed_once:    "      ✓ تم السماح مرة واحدة"
  allowed_session: "      ✓ تم السماح لهذه الجلسة"
  allowed_always:  "      ✓ تمت الإضافة إلى قائمة السماح الدائمة"
  denied:          "      ✗ تم الرفض"
  cancelled:       "      ✗ تم الإلغاء"
  blocklist_message: "هذا الأمر موجود في قائمة الحظر غير المشروطة ولا يمكن الموافقة عليه."

gateway:
  # Messenger replies to slash commands and implicit state changes.
  approval_expired: "⚠️ انتهت صلاحية الموافقة، فلم يعد الوكيل في حالة انتظار. اطلب من الوكيل المحاولة مرة أخرى."
  draining:         "⏳ يتم إنهاء عمل {count} وكيل/وكلاء نشطين قبل إعادة التشغيل..."
  goal_cleared:     "✓ تم مسح الهدف."
  no_active_goal:   "لا يوجد هدف نشط."
  config_read_failed: "⚠️ تعذّرت قراءة config.yaml: {error}"
  config_save_failed: "⚠️ تعذّر حفظ الإعدادات: {error}"
